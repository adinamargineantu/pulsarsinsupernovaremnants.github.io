
<DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Association Information</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #d8d8d8;
    --header-bg: #f4f4f2;
    --row-alt: #fafafa;
    --row-hover: #eef4fb;
    --link: #0b5fa5;
    --link-visited: #5b3a9e;
    --accent: #0b5fa5;
    --mono: "Consolas", "Menlo", "DejaVu Sans Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 1.25rem 4rem;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
  }

  header {
    max-width: 1150px;
    margin: 0 auto;
    padding: 2.5rem 0 1rem;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 0.3rem;
    letter-spacing: -0.01em;
  }

  .byline {
    color: var(--muted);
    font-size: 0.92rem;
    margin-bottom: 1.1rem;
  }

  .content {
    max-width: 1150px;
    margin: 0 auto;
  }

  .section {
    margin: 0 0 1.5rem;
  }

  .section-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 0.55rem;
  }

  .info {
    font-size: 0.95rem;
    color: #333;
    margin: 0;
  }

  .image-placeholder {
    width: 520px;
    min-height: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--header-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 1.5rem;
  }

  .image-placeholder img {
    max-width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
  }

  .details {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .detail-row {
    display: grid;
    grid-template-columns: 180px 1fr;
    border-bottom: 1px solid #ececec;
  }

  .detail-row:last-child {
    border-bottom: none;
  }

  .detail-label,
  .detail-value {
    padding: 0.65rem 0.8rem;
  }

  .detail-label {
    background: var(--header-bg);
    font-weight: 600;
    color: #333;
  }

  .detail-value {
    color: #333;
    min-height: 2.8rem;
  }

  a {
    color: var(--link);
    text-decoration: none;
  }

  a:hover { text-decoration: underline; }
  a:visited { color: var(--link-visited); }

  footer {
    max-width: 1150px;
    margin: 1.5rem auto 0;
    color: var(--muted);
    font-size: 0.82rem;
  }

  @media (max-width: 640px) {
    h1 { font-size: 1.3rem; }
    body { padding: 0 0.8rem 3rem; }

    .image-placeholder {
      width: 100%;
    }

    .detail-row {
      grid-template-columns: 1fr;
    }

    .detail-label {
      border-bottom: 1px solid #ececec;
    }
  }
</style>
</head>
<body>

<header>
  <h1>J1737-3137 & G356.717+00.139</h1>
  <div class="byline">New Candidate</div>
</header>

<div class="content">

  <div class="section">
    <div class="image-placeholder">
      <img src="images/G356.717+00.139.png" alt="G356.717+00.139">
    </div>
  </div>

 
</div>


</body>
</html>
